name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.19.4
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check regressions
        run: pnpm check:dates && pnpm check:times && pnpm check:onboarding && pnpm check:storage && pnpm check:auth-redirect && pnpm check:auth-flow && pnpm check:profile-handle && pnpm check:collections && pnpm check:chat && pnpm check:groups-notifications && pnpm check:event-creation

      - name: Check event retrieval regressions
        run: pnpm check:event-fetch

      - name: Check event editing regressions
        run: pnpm check:event-edit && pnpm check:uri

      - name: Check resolved Expo build configuration
        run: pnpm check:build-config

      - name: Check Pages asset packaging
        run: node scripts/pages-regression-check.mjs

      - name: Check Expo dependencies
        run: pnpm exec expo-doctor

      - name: Audit production dependencies
        run: pnpm audit --prod

  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Apply migrations to an isolated database
        run: supabase db start

      - name: Run database tests
        run: supabase test db supabase/tests

      - name: Lint database schemas
        run: supabase db lint --local --level warning
