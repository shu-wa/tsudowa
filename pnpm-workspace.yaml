auditConfig:
  # Expo/Metro build-time image metadata parser. No fixed image-size release is
  # available yet (reviewed 2026-08-28). Keep this exception limited to the
  # two reviewed GHSAs and remove it when Expo/Metro adopts a fixed release.
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    # decode-uri-component 0.2.2 is patched below with a bounded UTF-8 scan.
    # Upstream 0.5.0 is ESM-only; query-string 7 requires the CommonJS API.
    # check:uri verifies malformed-input termination and decoding compatibility.
    - GHSA-vcc3-ghjq-m6fr
onlyBuiltDependencies:
  - unrs-resolver

overrides:
  '@xmldom/xmldom@<0.9.0': 0.8.15
  '@xmldom/xmldom@>=0.9.0': 0.9.12
  baseline-browser-mapping: 2.11.0
  brace-expansion: 5.0.9
  browserslist: 4.28.7
  js-yaml@^3.0.0: 3.15.2
  js-yaml@^4.0.0: 4.3.2
  nanoid: 3.3.18
  postcss: 8.5.23
  tar: 7.5.21
  undici: 6.28.0
  uuid: 11.1.1

patchedDependencies:
  decode-uri-component@0.2.2: patches/decode-uri-component@0.2.2.patch
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
